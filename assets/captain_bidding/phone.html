<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Calgary Vipers — Captain Bidding</title>
<style>
  :root {
    --background: #0d0f12;
    --surface: #15181d;
    --surface-alt: #1c2027;
    --border: #262b33;
    --text-primary: #f2f4f7;
    --text-secondary: #9aa4b2;
    --green: #28c76f;
    --green-hover: #22a860;
    --red: #e5484d;
    --gold: #e3c274;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--background); color: var(--text-primary);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.5px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
  .mode-badge {
    display: inline-block; border-radius: 6px; padding: 4px 10px; font-size: 11px;
    font-weight: 700; letter-spacing: 0.5px; margin-bottom: 12px;
  }
  .mode-mock { background: var(--surface-alt); color: var(--text-secondary); }
  .mode-live { background: var(--red); color: var(--text-primary); }
  .card {
    background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .login-heading { font-weight: 700; font-size: 16px; margin: 8px 0 4px; text-align: center; }
  .login-sub { color: var(--text-secondary); font-size: 12px; text-align: center; margin-bottom: 18px; }
  .pin-input {
    display: block; width: 100%; max-width: 220px; margin: 0 auto; text-align: center;
    font-size: 34px; letter-spacing: 14px; font-weight: 700; padding: 14px 0 14px 14px;
    background: var(--surface-alt); color: var(--text-primary); border: 2px solid var(--border);
    border-radius: 12px;
  }
  .pin-input:focus { outline: none; border-color: var(--green); }
  .connect-button {
    display: block; width: 100%; max-width: 220px; margin: 16px auto 0; padding: 16px 0;
    background: var(--green); color: var(--background); border: none; border-radius: 10px;
    font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .connect-button:active { background: var(--green-hover); }
  .connect-button:disabled { background: var(--surface-alt); color: var(--text-secondary); }
  .login-error {
    max-width: 220px; margin: 12px auto 0; text-align: center; color: var(--red);
    font-size: 13px; font-weight: 700; min-height: 18px;
  }
  .connected-as { text-align: center; margin-bottom: 4px; }
  .connected-as-label { color: var(--text-secondary); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  .connected-as-team { font-size: 22px; font-weight: 800; color: var(--green); }
  .log-out-link {
    text-align: center; margin-top: 6px; margin-bottom: 12px; color: var(--text-secondary);
    font-size: 12px; text-decoration: underline; cursor: pointer;
  }
  .player-photo {
    width: 100%; max-width: 260px; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 12px; border: 3px solid var(--green); display: block; margin: 0 auto 12px;
    background: var(--surface-alt);
  }
  .player-photo-placeholder {
    width: 100%; max-width: 260px; aspect-ratio: 4 / 5; border-radius: 12px;
    border: 3px solid var(--green); margin: 0 auto 12px; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; font-size: 48px;
    font-weight: 700; color: var(--text-secondary);
  }
  .player-name { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .badge-row { display: flex; justify-content: center; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .position-badge {
    background: var(--surface-alt); color: var(--text-primary); border-radius: 6px;
    padding: 3px 10px; font-size: 12px; font-weight: 700;
  }
  .ovr-value { color: var(--gold); font-size: 22px; font-weight: 700; }
  .ovr-label { color: var(--text-secondary); font-size: 11px; font-weight: 700; }
  .fpl-line { text-align: center; color: var(--gold); font-size: 13px; font-weight: 700; margin-top: 4px; }
  .bid-row { display: flex; justify-content: space-between; margin: 10px 0; }
  .bid-label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .bid-value { font-size: 26px; font-weight: 800; }
  .bid-value.gold { color: var(--gold); }
  .leading-team { font-size: 16px; font-weight: 700; color: var(--green); text-align: right; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat-block { text-align: center; }
  .stat-value { font-size: 17px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }
  .bid-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .bid-button {
    background: var(--green); color: var(--background); border: none; border-radius: 10px;
    padding: 18px 0; font-size: 18px; font-weight: 800; cursor: pointer;
  }
  .bid-button:active { background: var(--green-hover); }
  .bid-button:disabled { background: var(--surface-alt); color: var(--text-secondary); }
  .reject-message {
    margin-top: 10px; background: var(--red); color: var(--text-primary); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-weight: 700; text-align: center; display: none;
  }
  .status-message { text-align: center; font-size: 16px; font-weight: 700; margin-top: 40px; }
  .status-sub { text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: 8px; }
  .connection-pill {
    display: inline-block; border-radius: 6px; padding: 3px 9px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; background: var(--surface-alt); color: var(--text-secondary); float: right;
  }
  .connection-pill.online { color: var(--green); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <h1>CALGARY VIPERS</h1>
  <div class="subtitle">CAPTAIN BIDDING</div>

  <div id="login-screen">
    <div id="mode-badge-login"></div>
    <div class="card">
      <div class="login-heading">ENTER TEAM PIN</div>
      <div class="login-sub">Ask the organizer for your team's 4-digit PIN.</div>
      <input class="pin-input" id="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />
      <button class="connect-button" id="connect-button">CONNECT</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="bidding-screen" hidden>
    <div id="mode-badge-bid"></div>
    <span class="connection-pill" id="connection-pill">CONNECTED</span>
    <div class="connected-as">
      <div class="connected-as-label">CONNECTED AS</div>
      <div class="connected-as-team" id="connected-team-name"></div>
    </div>
    <div class="log-out-link" id="log-out-link">Log out</div>

    <div id="status-screen" hidden>
      <div class="status-message" id="status-message"></div>
      <div class="status-sub" id="status-sub"></div>
    </div>

    <div id="bidding-content" hidden>
      <div class="card">
        <img class="player-photo" id="player-photo" hidden />
        <div class="player-photo-placeholder" id="player-photo-placeholder" hidden></div>
        <div class="player-name" id="player-name"></div>
        <div class="badge-row">
          <span class="position-badge" id="player-position"></span>
          <span><span class="ovr-value" id="player-ovr"></span> <span class="ovr-label">OVR</span></span>
        </div>
        <div class="fpl-line" id="player-fpl"></div>
      </div>

      <div class="card">
        <div class="bid-row">
          <div>
            <div class="bid-label">Base Price</div>
            <div class="leading-team" id="base-price" style="text-align: left">—</div>
          </div>
          <div>
            <div class="bid-label">Current Highest Bid</div>
            <div class="bid-value gold" id="current-bid">—</div>
          </div>
          <div>
            <div class="bid-label">Leading Team</div>
            <div class="leading-team" id="leading-team">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="bid-label">YOUR TEAM</div>
        <div class="stat-grid">
          <div class="stat-block"><div class="stat-value" id="your-budget"></div><div class="stat-label">Budget</div></div>
          <div class="stat-block"><div class="stat-value" id="your-squad"></div><div class="stat-label">Squad</div></div>
          <div class="stat-block"><div class="stat-value" id="your-max-bid"></div><div class="stat-label">Max Legal Bid</div></div>
        </div>
        <div class="bid-buttons">
          <button class="bid-button" data-increment="1">+1M</button>
          <button class="bid-button" data-increment="2">+2M</button>
          <button class="bid-button" data-increment="5">+5M</button>
        </div>
        <div class="reject-message" id="reject-message"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const POLL_INTERVAL_MS = 750;
  const TOKEN_KEY = "captain_bidding_token";

  // First Auction Rules V2: the current player's own minimum legal price
  // (GK_BASE_PRICE / OUTFIELD_BASE_PRICE, resolved server-side) — used so
  // a quick-bid button submits max(base_price, increment) before any bid
  // exists yet, instead of just the raw increment (see the desktop
  // equivalent in ui/screens/live_auction_screen.py's _on_desktop_bid_clicked).
  let currentBasePrice = null;

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function saveToken(token) { localStorage.setItem(TOKEN_KEY, token); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  let token = getToken();

  const loginScreen = document.getElementById("login-screen");
  const biddingScreen = document.getElementById("bidding-screen");
  const pinInput = document.getElementById("pin-input");
  const connectButton = document.getElementById("connect-button");
  const loginError = document.getElementById("login-error");
  const connectedTeamName = document.getElementById("connected-team-name");
  const connectionPill = document.getElementById("connection-pill");
  const logOutLink = document.getElementById("log-out-link");
  const statusScreen = document.getElementById("status-screen");
  const statusMessage = document.getElementById("status-message");
  const statusSub = document.getElementById("status-sub");
  const biddingContent = document.getElementById("bidding-content");
  const rejectMessage = document.getElementById("reject-message");

  function modeBadgeHtml(mode) {
    if (mode === "LIVE") return '<span class="mode-badge mode-live">LIVE AUCTION</span>';
    if (mode === "MOCK") return '<span class="mode-badge mode-mock">MOCK AUCTION</span>';
    return "";
  }

  function showLoginScreen(message) {
    token = null;
    clearToken();
    loginScreen.hidden = false;
    biddingScreen.hidden = true;
    loginError.textContent = message || "";
    pinInput.value = "";
  }

  function showBiddingScreen() {
    loginScreen.hidden = true;
    biddingScreen.hidden = false;
  }

  function authHeaders() {
    return token ? { "X-Captain-Token": token } : {};
  }

  function attemptLogin() {
    const pin = pinInput.value.trim();
    if (!/^\d{4}$/.test(pin)) {
      loginError.textContent = "Enter the 4-digit PIN.";
      return;
    }
    connectButton.disabled = true;
    loginError.textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pin }),
    })
      .then(function (response) { return response.json().then(function (body) { return { status: response.status, body: body }; }); })
      .then(function (result) {
        connectButton.disabled = false;
        if (result.body.accepted) {
          token = result.body.token;
          saveToken(token);
          showBiddingScreen();
          fetchState();
        } else {
          loginError.textContent = result.body.message || "Invalid PIN.";
        }
      })
      .catch(function () {
        connectButton.disabled = false;
        loginError.textContent = "Network error — please try again.";
      });
  }

  connectButton.addEventListener("click", attemptLogin);
  pinInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") attemptLogin();
  });
  pinInput.addEventListener("input", function () {
    pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 4);
  });

  logOutLink.addEventListener("click", function () {
    fetch("/api/logout", { method: "POST", headers: authHeaders() }).catch(function () {});
    showLoginScreen("");
  });

  function showStatus(message, sub) {
    statusScreen.hidden = false;
    biddingContent.hidden = true;
    statusMessage.textContent = message;
    statusSub.textContent = sub || "";
  }

  function renderBiddingState(state) {
    document.getElementById("mode-badge-bid").innerHTML = modeBadgeHtml(state.session_mode);
    connectedTeamName.textContent = state.team_name || "";
    connectionPill.textContent = "CONNECTED";
    connectionPill.classList.add("online");

    if (state.auction_status === "BLOCKED") {
      showStatus("AUCTION BLOCKED", "Bidding unavailable.");
      return;
    }
    if (state.auction_status === "COMPLETE") {
      showStatus("AUCTION COMPLETE", "Bidding closed.");
      return;
    }
    if (!state.current_player) {
      showStatus("WAITING FOR NEXT PLAYER", "");
      return;
    }

    statusScreen.hidden = true;
    biddingContent.hidden = false;

    const player = state.current_player;
    const photoImg = document.getElementById("player-photo");
    const photoPlaceholder = document.getElementById("player-photo-placeholder");
    if (player.photo_url) {
      photoImg.src = player.photo_url;
      photoImg.hidden = false;
      photoPlaceholder.hidden = true;
    } else {
      photoImg.hidden = true;
      photoPlaceholder.hidden = false;
      photoPlaceholder.textContent = player.full_name.slice(0, 2).toUpperCase();
    }
    document.getElementById("player-name").textContent = player.full_name.toUpperCase();
    document.getElementById("player-position").textContent = player.position;
    document.getElementById("player-ovr").textContent = player.overall_rating;
    document.getElementById("player-fpl").textContent = "FPL " + player.fpl_display;
    document.getElementById("base-price").textContent = player.base_price + "M";
    currentBasePrice = player.base_price;

    document.getElementById("current-bid").textContent = state.current_bid != null ? state.current_bid + "M" : "—";
    document.getElementById("leading-team").textContent = state.leading_team_name || "—";

    const yourTeam = state.own_team;
    if (yourTeam) {
      document.getElementById("your-budget").textContent = yourTeam.remaining_budget + "M";
      document.getElementById("your-squad").textContent = yourTeam.roster_size + "/" + yourTeam.max_squad_size;
      document.getElementById("your-max-bid").textContent = yourTeam.maximum_legal_bid + "M";
    }

    const disableBidding = !state.bidding_enabled;
    document.querySelectorAll(".bid-button").forEach(function (button) {
      button.disabled = disableBidding;
    });
  }

  function fetchState() {
    fetch("/api/state", { headers: authHeaders() })
      .then(function (response) { return response.json(); })
      .then(function (state) {
        if (state.no_active_session) {
          if (!token) { showLoginScreen(""); }
          showBiddingScreen();
          document.getElementById("mode-badge-bid").innerHTML = "";
          showStatus("NO ACTIVE AUCTION", "Waiting for organizer to start or resume a session.");
          return;
        }
        if (!token) {
          document.getElementById("mode-badge-login").innerHTML = modeBadgeHtml(state.session_mode);
          return;
        }
        if (!state.authenticated) {
          // The token we hold is no longer valid — reset by the
          // organizer, all PINs regenerated, or the server/app restarted
          // since we logged in. Distinct message from "never logged in."
          const message = state.session_invalid ? "Your session was reset. Please enter your PIN again." : "";
          showLoginScreen(message);
          return;
        }
        showBiddingScreen();
        renderBiddingState(state);
      })
      .catch(function () { /* transient network hiccup — next poll will retry */ });
  }

  document.querySelectorAll(".bid-button").forEach(function (button) {
    button.addEventListener("click", function () {
      if (!token) return;
      const increment = parseInt(button.getAttribute("data-increment"), 10);
      const currentText = document.getElementById("current-bid").textContent;
      const currentBid = currentText === "—" ? 0 : parseInt(currentText, 10);
      // First Auction Rules V2: before any bid exists, a quick-bid button
      // submits max(base_price, increment) rather than the raw increment
      // alone, so tapping +1M on a 4M-base goalkeeper submits a legal 4M
      // bid instead of a rejected 1M one.
      const amount = currentBid > 0 ? currentBid + increment : Math.max(currentBasePrice || 0, increment);

      fetch("/api/bid", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({ amount: amount }),
      })
        .then(function (response) {
          if (response.status === 401) {
            showLoginScreen("Your session was reset. Please enter your PIN again.");
            throw new Error("unauthenticated");
          }
          return response.json();
        })
        .then(function (result) {
          if (!result.accepted) {
            rejectMessage.textContent = result.reason || "Bid rejected.";
            rejectMessage.style.display = "block";
            setTimeout(function () { rejectMessage.style.display = "none"; }, 3000);
          } else {
            rejectMessage.style.display = "none";
          }
          fetchState();
        })
        .catch(function () {
          rejectMessage.textContent = "Network error — bid may not have been received.";
          rejectMessage.style.display = "block";
        });
    });
  });

  if (token) {
    showBiddingScreen();
  }
  fetchState();
  setInterval(fetchState, POLL_INTERVAL_MS);
})();
</script>
</body>
</html>
